# sysc-walls daemon configuration

[idle]
timeout = 5m
min_duration = 30s

[daemon]
debug = false

[animation]
effect = beam-text
# Available effects: matrix, matrix-art, fire, fire-text, fireworks, rain, rain-art, beams, beam-text, ring-text, blackhole, aquarium, pour, print, decrypt
theme = tranishardjob
# Available themes: dracula, catppuccin, catppuccin-mocha, nord, tokyo-night, tokyonight, gruvbox, material, solarized, monochrome, transishardjob, rama, eldritch, dark
cycle = false
cycle_interval = 5m

[terminal]
kitty = true
fullscreen = true
