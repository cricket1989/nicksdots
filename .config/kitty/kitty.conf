# ┛┛┛┛ ┛ ┛ ━━┛┛ ┛┛┛ ┛━━┛   ┛ ━━┛━━┛  ┛ ┛ ┛ ┛  ┛ ┛━━┛┛ ┛┛ ┛━━

#include ~/.config/kitty/colors.conf

font_family       GeistMono Nerd Font Mono
font_size         14

disable_ligatures yes
enable_audio_bell no

shell zsh
shell_integration disabled

cursor_shape          block

url_color #d94011
url_style curly

remember_window_size  no
 initial_window_width  640
 initial_window_height 400
#initial_window_width  78c
#initial_window_height 23c
window_padding_width  30
cursor_blink_interval 0


scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0

# Copy selection automatically
copy_on_select yes
# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font size
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0

# Nick's Kitty keybind pack
# ----------------------------

# Use kitty_mod (defaults to ctrl+shift). You can change it globally:
 kitty_mod ctrl+shift

# Reload config (handy while tweaking)
map kitty_mod+r load_config_file

# Clipboard (Wayland-friendly in kitty)
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# Search scrollback
map kitty_mod+f search_in_scrollback

# Open kitty's sample config in editor (great reference)
map kitty_mod+f2 edit_config_file

# ===== Tabs =====
map kitty_mod+t new_tab
map kitty_mod+q close_tab
map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9

# ===== Splits / Windows (kitty calls them "windows") =====
map kitty_mod+enter new_window
map kitty_mod+w close_window

# Split orientation
map kitty_mod+s launch --location=hsplit
map kitty_mod+a launch --location=vsplit

# ===== Quick tools =====
# show key events (great for debugging “why doesn't this bind fire”)
map kitty_mod+escape kitten show-key -m kitty
# -- Performance settings
sync_to_monitor no


# -- Speed shit up
allow_remote_control yes
listen_on unix:/tmp/kitty

# -- Perf
#repaint_delay     8
#input_delay       3


include dank-tabs.conf
include dank-theme.conf
