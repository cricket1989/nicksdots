music_directory    "~/Music/MPD"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"

bind_to_address "127.0.0.1"
port "6600"
restore_paused "no"

audio_output {
    type "pipewire"
    name "PipeWire"
}

audio_output {
    type   "fifo"
    name   "my_fifo"
    path   "/tmp/mpd.fifo"
    format "44100:16:2"
}
