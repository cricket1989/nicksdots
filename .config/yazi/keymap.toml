# ~/.config/yazi/keymap.toml

[mgr]
prepend_keymap = [
  # --- QUICK HELP ---
  { on = "?", run = "help", desc = "Help" },
  { on = ["z"], run = "plugin zoxide", desc = "Jump with zoxide" },
  # --- EDIT / OPEN ---
  # Edit hovered in VS Code (Snap) + focus VS Code (Hyprland)
  { on = "e", run = 'shell --orphan --confirm=false -- sh -lc "/var/lib/snapd/snap/bin/code -r \"%h\" >/dev/null 2>&1 & sleep 0.12; hyprctl dispatch focuswindow \"class:^(code|Code)$\" >/dev/null 2>&1 || true"', desc = "Edit in Code (focus)" },
  { on = "J", run = 'shell --confirm=false -- sh -lc "cd \"$(zoxide query -i)\""', desc = "Jump (zoxide)" },
  # Open hovered using open.rules (Enter already does this, this is an extra)
  { on = "o", run = "open --hovered", desc = "Open hovered" },

    # Reveal current directory in file manager
  { on = "R", run = "reveal", desc = "Reveal in system file manager" },

  # --- SELECTION ---
  { on = " ", run = "select --state=toggle", desc = "Toggle selection" },
  { on = "v", run = "visual_mode", desc = "Visual select mode" },
  { on = "V", run = "select_all", desc = "Select all" },
  { on = "u", run = "select --state=none", desc = "Clear selection" },

  # --- COPY / CUT / PASTE (file operations) ---
  { on = "y", run = "yank", desc = "Copy selected (yank)" },
  { on = "x", run = "yank --cut", desc = "Cut selected" },
  { on = "p", run = "paste", desc = "Paste" },
  { on = "P", run = "paste --force", desc = "Paste (overwrite)" },

  # --- CREATE / RENAME ---
  { on = "a", run = "create", desc = "Create file/dir" },
  { on = "r", run = "rename", desc = "Rename" },

  # --- TRASH ONLY (SAFE DELETE) ---
  { on = "d", run = "remove", desc = "Trash selected" },
  { on = "D", run = "remove", desc = "Trash selected (no permanent delete)" },

  # --- SEARCH / FILTER ---
  { on = "/", run = "search", desc = "Search" },
  { on = "f", run = "filter", desc = "Filter in current dir" },

  # --- COPY TO CLIPBOARD (Wayland) ---
  { on = [ "c", "p" ], run = 'shell --confirm=false -- sh -lc "printf %s \"%h\" | wl-copy"', desc = "Copy hovered path" },
  { on = [ "c", "n" ], run = 'shell --confirm=false -- sh -lc "basename \"%h\" | wl-copy"', desc = "Copy hovered name" },

  # Copy current directory path
  { on = [ "c", "d" ], run = 'shell --confirm=false -- sh -lc "printf %s \"%CWD\" | wl-copy"', desc = "Copy cwd path" },

  # --- QUALITY OF LIFE ---
  { on = "q", run = "quit", desc = "Quit" },
]
