# -- Autostart -- #

# Waybar
exec-once = bash /home/nick/.config/waybar/scripts/launch.sh

# Wallpaper
exec-once = swww-daemon
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target
# Privilege escalation
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = pypr &
#exec-once = udiskie
exec-once = hypridle &
exec-once = wlsunset -T 4200
exec-once = nm-applet &
exec-once = hyprpm reload
exec-once = sleep 3 && hyprctl dispatch dpms off DP-2 && sleep 1 && hyprctl dispatch dpms on DP-2

