# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

# ==================
# MONITOR ROUTING
# ==================
# DP-2 = workspace 1 | DP-3 = workspace 2 | DP-1 = workspace 9

# Terminals → DP-1 (workspace 9) — must come before editor title rules
windowrule = workspace 9, match:class ^(kitty|Alacritty|org\.kde\.konsole|org\.wezfurlong\.wezterm)$

# Code editors → DP-2 (workspace 1)
# VSCode by class; nvim/micro by title (overrides terminal workspace rule above)
windowrule = workspace 1, match:class ^(code-oss|[Cc]ode)$
windowrule = workspace 1, match:title ^(nvim|NVIM|neovim|micro)$

# Browsers → DP-3 (workspace 2)
windowrule = workspace 2, match:class ^(zen|firefox|floorp|chromium|brave|vivaldi)$

# ncmpcpp — float + pin (sticky, visible on all workspaces)
windowrule = float on, match:title ^ncmpcpp$
windowrule = pin on,   match:title ^ncmpcpp$
windowrule = size 900 600, match:title ^ncmpcpp$

# ==================
# LAYER RULES
# ==================
# Waybar


# Blur Waybar (layer surface)
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.01, match:namespace waybar
# Rofi
layerrule = blur on, match:namespace ^rofi$
layerrule = ignore_alpha 0, match:namespace ^rofi$

# Notifications (generic) - (optional) cleaner edges like swaync
layerrule = blur on, match:namespace ^notifications$
layerrule = ignore_alpha 0.5, match:namespace ^notifications$

# SwayNC popups (FIX: cleaner blur/shadow edges)
layerrule = blur on, match:namespace ^swaync-notification-window$
layerrule = ignore_alpha 0.5, match:namespace ^swaync-notification-window$

# SwayNC control center (FIX: cleaner blur/shadow edges)
layerrule = blur on, match:namespace ^swaync-control-center$
layerrule = ignore_alpha 0.5, match:namespace ^swaync-control-center$

# Logout dialog
layerrule = blur on, match:namespace ^logout_dialog$
layerrule = ignore_alpha 0, match:namespace ^logout_dialog$

# QuickShell
layerrule = no_anim on, match:namespace ^(quickshell)$


# ==================
# WINDOW RULES
# idle_inhibit rules
windowrule = match:class ^(celluloid|mpv|vlc)$, idle_inhibit fullscreen
windowrule = match:class ^([Ss]potify)$, idle_inhibit fullscreen
windowrule = match:class ^(floorp|firefox|chromium|zen|vivaldi)$, idle_inhibit fullscreen
windowrule = match:class ^(steam)$, idle_inhibit fullscreen
windowrule = match:class ^(steam_app_.*)$, idle_inhibit fullscreen

# no hyprbars on terminals
# no hyprbars on terminals
#windowrule = match:float 0, hyprbars:no_bar on
windowrule = match:class ^(kitty|Alacritty|org\.kde\.konsole|org\.wezfurlong\.wezterm)$, hyprbars:no_bar on
#windowrule = match:class ^(swaync)$, border_size 0

# Steam: fully solid, no blur/shadow/anim
windowrule = match:class ^(steam)$, opacity 1.0 override 1.0 override, no_blur on, no_shadow on, no_anim on, force_rgbx on

# Fix some dragging issues with XWayland (empty class/title tooltips etc.)
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

# pavucontrol
windowrule = match:class pavucontrol, float on, center on

# scratchpad files
windowrule = match:class scratchpad-files, float on, center on

# Dialog windows
windowrule = match:class ^(yad)$, float on, center on

# Greetings
windowrule = match:title ^(greeting)$, float on, center on, size 1000 300, animation gnomed
windowrule = match:title ^(welcome)$, float on, center on, size 1000 300, animation gnomed
windowrule = match:title ^(welcome to hyprland)$, float on, center on, size 1000 300, animation gnomed
windowrule = match:title ^(hyprland greeting)$, float on, center on, size 1000 300, animation gnomed
windowrule = match:title ^(hyprland welcome)$, float on, center on, size 1000 300, animation gnomed
windowrule = match:title ^(welcome to hyprland!)$, float on, center on, size 1000 300, animation gnomed
windowrule = match:title ^(hyprland greeting!)$, float on, center on, size 1000 300, animation gnomed


# ==================
# OPACITY / LOOK
# ==================

# Spotify
windowrule = opacity 0.70 override 0.75 override, match:class ^([Ss]potify)$
windowrule = opacity 0.70 override 0.75 override, match:initial_title ^(Spotify Free)$
windowrule = opacity 0.70 override 0.75 override, match:initial_title ^(Spotify Premium)$

# Browsers: always fully opaque (Zen + the rest)
# (place after any other opacity lines so it wins)
windowrule = opacity 1.0 override 1.0 override, match:class ^(zen|firefox|floorp|chromium|brave|vivaldi)$

# VS Code family
windowrule = opacity 0.95 override 0.80 override, match:class ^(code-oss)$
windowrule = opacity 0.95 override 0.80 override, match:class ^([Cc]ode)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(code-url-handler)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(code-insiders-url-handler)$

# Terminals (baseline you already had)
windowrule = opacity 0.70 override 0.70 override, match:class ^(kitty)$
windowrule = opacity 0.70 override 0.70 override, match:class ^(org\.wezfurlong\.wezterm)$
windowrule = opacity 0.70 override 0.70 override, match:class ^(Alacritty)$
windowrule = opacity 0.70 override 0.70 override, match:class ^(org\.kde\.konsole)$

# Pypr scratchpads — match kitty opacity
windowrule = opacity 0.70 override 0.70 override, match:class ^(console-dropdown)$
windowrule = opacity 0.70 override 0.70 override, match:class ^(spmusic)$
windowrule = opacity 0.70 override 0.70 override, match:class ^(scratchpad-files)$
windowrule = opacity 0.70 override 0.70 override, match:class ^(scratchpad-neovim)$
windowrule = opacity 0.70 override 0.70 override, match:class ^(term_quake)$

# File managers
windowrule = opacity 0.80 override 0.70 override, match:class ^(org\.kde\.dolphin)$
windowrule = opacity 0.85 override 0.70 override, match:class ^(org\.gnome\.Nautilus)$

# Yazi (usually runs in a terminal, but if you run it via something that gives it a class/title, try these)
# If this does nothing, it means Yazi is just "kitty/alacritty" class and will follow terminal rules below.
windowrule = opacity 0.70 override 0.70 override, match:title ^(yazi)$
windowrule = opacity 0.70 override 0.70 override, match:initial_title ^(yazi)$

# Misc apps
windowrule = opacity 0.90 override 0.80 override, match:class ^(org\.kde\.ark)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(nwg-look)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(vesktop)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(qt5ct)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(qt6ct)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(kvantummanager)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(org\.pulseaudio\.pavucontrol)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(blueman-manager)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(nm-applet)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(nm-connection-editor)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(org\.freedesktop\.impl\.portal\.desktop\.gtk)$
windowrule = opacity 0.90 override 0.80 override, match:class ^(org\.freedesktop\.impl\.portal\.desktop\.hyprland)$

# workaround for jetbrains IDE dropdowns/popups cause flickering
windowrule = no_initial_focus true, match:class ^(.*jetbrains.*)$, match:title ^(win[0-9]+)$

# suppress maximize events
windowrule = match:class .*, suppress_event maximize

# Remove right-click menu blur in Chromium browsers (empty class/title)
windowrule = match:class ^$, match:title ^$, no_blur on

# VSCode/Codium: avoid weird popup sizing issues
windowrule = match:class ^()$, min_size 1 1


# ==================
# FLOAT / SIZE / CENTER
# ==================

# File pickers / portals floating + centered (by title)
windowrule = match:title ^(Open File|Open Folder|Open|Save|Save As|Export|Import|Choose File|Rename|script-fu|kdenlive|brave)$, float on, center on

# Portals floating + centered (by class)
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on
windowrule = match:class ^(xdg-desktop-portal-hyprland)$, float on, center on
windowrule = match:class ^(Xdg-desktop-portal-gtk)$, float on, center on
windowrule = match:class ^(Xdg-desktop-portal-hyprland)$, float on, center on

# Wezterm — tiled by default, opacity matches kitty
windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(steam)$
windowrule = float on, match:class ^(xdg-desktop-portal)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

# Dolphin behavior
windowrule = float on, match:class ^(org\.kde\.dolphin)$
windowrule = size 900 700, match:class ^(org\.kde\.dolphin)$
windowrule = center on, match:class ^(org\.kde\.dolphin)$

# Nautilus behavior
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = size 900 700, match:class ^(org\.gnome\.Nautilus)$
windowrule = center on, match:class ^(org\.gnome\.Nautilus)$

# Theme / appearance tools
windowrule = float on, center on, match:class ^(nwg-look)$
windowrule = float on, center on, match:class ^(kvantummanager)$
windowrule = float on, center on, match:class ^(qt5ct)$
windowrule = float on, center on, match:class ^(qt6ct)$

# DMS / QuickShell windows floating by default
# ! Hyprland doesn't size these windows correctly so disabling by default here

windowrule = float on, match:class ^(org\.quickshell)$
#windowrule = size 800 1200, match:class ^(org\.quickshell)$
#windowrule = center on, match:class ^(org\.quickshell)$

# ==================
# BOTTOM: UNIVERSAL EDITOR/CLI TRANSPARENCY (AS REQUESTED)
# ==================
# Neovim / micro / nano "sessions" usually run inside your terminal,
# so these rules target common terminal titles AND apply to the terminal window itself.
# Focused = 80%  / Unfocused = 70%
#
# If you want this ONLY when you're actually editing, make your terminal set title like "nvim" "micro" "nano".
#windowrule = opacity 0.80 override 0.70 override, match:title ^(nvim|neovim|micro|nano)$
#windowrule = opacity 0.80 override 0.70 override, match:initial_title ^(nvim|neovim|micro|nano)$


