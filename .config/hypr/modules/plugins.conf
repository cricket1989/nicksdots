# Matugen-generated colors (make sure this file defines $mg_bar, $mg_text, etc.)
source = /home/nick/.config/hypr/colors/colors.conf

plugin {
  hyprbars {
    bar_height = 22
    bar_blur   = true

    bar_title_enabled = true
    bar_text_size     = 12
    bar_text_font     = "SF Pro Display Semibold"

    bar_padding        = 10
    bar_button_padding = 4

    # text
    # text
    col.text          = $mg_text
    col.text_inactive = $mg_muted   # (still fine; this only affects title text on unfocused windows)
    
    # bar background (same for everything)
    col.bg            = $mg_warn_alpha
    col.bg_inactive   = $mg_warn_alpha
    
    # if your build supports it, force it too
    bar_color_inactive = $mg_warn_alpha
    
    # buttons (use your matugen vars)
    hyprbars-button = $mg_kill,   14, , hyprctl dispatch killactive
    hyprbars-button = $mg_warn,   14, 󰊓, hyprctl dispatch fullscreen 1
    hyprbars-button = $mg_accent, 14, 󰖯, hyprctl dispatch togglefloating
  }

  hyprexpo {
    columns = 3
    gap_size = 10
    bg_col = $mg_accent
    workspace_method = first 1 # [center/first] [workspace]
    skip_empty = true
  }

  hyprscrolling {
    column_width = 0.6
    fullscreen_on_one_column = true
    follow_focus = true
    focus_fit_method = 0
    explicit_column_widths = 0.5,0.67,0.8,1.0
  }


  easymotion {
    # readable, not huge
    textsize = 16
    textfont = "Sans"

    # Tokyo Night Storm-ish
    textcolor = rgba(c0caf5ff)   # foreground
    bgcolor   = rgba(24283bd9)   # storm bg w/ alpha (d9 ~= 85%)

    # make the “popup label boxes” actually look like UI
    rounding    = 10
    bordersize  = 2
    bordercolor = rgba(7aa2f7ff) # blue border

    # IMPORTANT: this takes gaps-style values (spaces, not commas)
    # top right bottom left
    textpadding = 4 10 6 10

    # blur needs semi-transparent bgcolor
    blur  = 2
    blurA = 2

    # what most people expect: show on normal windows too
    only_special = false

    # keep these sane
    xray = 0

    motionkeys   = abcdefghijklmnopqrstuvwxyz1234567890
    motionlabels = ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890

    fullscreen_action = none
  }
}
