[pyprland]
    # pypr has a lot of plugins, but this is just a basic example config
    # https://hyprland-community.github.io/pyprland/Plugins.html
    plugins = [ "scratchpads", "expose", "magnify" ]

# using variables for demonstration purposes (not needed)
[pyprland.variables]
    # term_with_class = "hyde-shell app -T" # You cannot set the class for this
    # term_with_class = "alacritty --class"
    # term_with_class = "foot --app-id"
    term_with_class = "kitty --class"


[scratchpads.console]
    # This is a drop-down terminal configuration
    animation = "fromTop"
    class     = "console-dropdown"
    command   = "[term_with_class] console-dropdown"
    max_size  = "90% 100%"
    size      = "75% 60%"
[scratchpads.music]
    command = "[term_with_class] spmusic -e ncmpcpp"
    class = "spmusic"
    animation = "fromBottom"
    position = "15% 40%"
    size = "70% 55%"
    pinned = true
    preserve_aspect = true
    alt_toggle = true

[scratchpads.files]
    command = "[term_with_class] scratchpad-files -e yazi"
    animation = "fromTop"
    max_size = "90% 100%"
    size = "75% 60%"
    lazy = true

[scratchpads.neovim]
    command = "[term_with_class] scratchpad-neovim -e nvim"
    animation = "fromTop"
    size = "90% 85%"
    max_size = "95% 95%"
    


[expose]
