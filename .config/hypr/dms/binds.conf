$mainMod = SUPER
$mod = ALT 
$menu = /home/nick/.config/rofi/scripts/launcher_t1
$menu1 = /home/nick/.config/rofi/applets/bin/apps.sh
$menu2 = /home/nick/.config/rofi/applets/bin/quicklinks.sh
$terminal = kitty
# Vision board
bind = $mod, G, exec, ristretto -f /home/nick/Pictures/screenshot_1769202072.png
bind = $mainMod, B, exec, zen-browser
bind = $mod, B, exec, firefox
bind = $mod SHIFT, D, exec, $menu2
bind = $mod, D, exec, $menu1
bind = $mainMod, D, exec,  $menu
bind = ALT, C, exec, rofi -show calc -theme ~/.local/share/rofi/themes/minimal.rasi
bind = $mod SHIFT, Y, exec, ~/.local/bin/yt-rofi-dl
# File manager
bind = $mainMod Shift, E, exec, nautilus
bind = $mainMod, E, exec, dolphin
bind = $mod, Z, exec, ~/.config/rofi/zoxide.sh
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, alacritty 
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, F, fullscreen, 1  
bind = $mainMod, W, exec, ~/.local/bin/dontkillsteam.sh
bind = $mainMod, V, togglefloating
bind = $mainMod, H, exec, hyprpicker -a
bind = $mainMod, K, exec, hyprctl kill
bind = $mainMod, P, pseudo, # dwindle
bindd = $mod, J, $d toggle split, togglesplit
bind = $mainMod SHIFT, B, exec, libreoffice
bind = $mainMod, J, exec, hyprctl keyword general:layout scrolling
bind = $mainMod SHIFT, J, exec, hyprctl keyword general:layout master
# wallpaper
bind = $mainMod SHIFT, W, exec, waypaper
bind = $mod SHIFT, RETURN, exec, pkill rofi || /home/nick/.local/bin/wallpick-2mon-swaybg
# Wallpaper switcher
bind = $mainMod SHIFT, T, exec, pkill rofi || ~/.config/colorschemes/wallpaper-selector.sh

# Theme swticher
bind = $mainMod, T, exec, pkill rofi || ~/.config/colorschemes/rofi-launcher.sh

# volume keys
bind = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 2 # Volume Up (2%)
bind = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 2 # Volume Down (2%)

# waybar
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh
bind = $mainMod Shift, R, exec, /home/nick/.local/bin/waybar-layout-switcher

# screenshots
bind = $mainMod, F12, exec, grim -t png -l 5
bind = $mainMod SHIFT, F12, exec, grim -t png -l 0 -g "$(slurp)" ~/Pictures/screenshot_$(date +%s).png

# scripts
bind = WIN, F1, exec, ~/.config/hypr/scripts/blitz-mode.sh
bind = $mod, F12, exec, /home/nick/.local/bin/rotate-dp-2.sh
bind = $mod, N, exec, ~/.local/bin/night-mode.sh
bind = $mainMod, Q, hyprexpo:expo, toggle
bind = $mod SHIFT, C, exec, ~/.local/bin/focus-clock
bind = CTRL ALT, DELETE, exec, wlogout -C "$HOME/.config/wlogout/style.css" \
        -l "$HOME/.config/wlogout/layout" \
        --protocol layer-shell \
        -b 5 \
        -T 400 \
        -B 400
bind = $mainMod SHIFT, L, exec, hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf
bind = $mainMod,F3,exec,pypr toggle volume
bind = $mod, F, exec, pypr expose
workspace = special:exposed,gapsout:40,gapsin:20,bordersize:5,border:true,shadow:false
# Titlebars
$hyprbars = /var/cache/hyprpm/nick/hyprland-plugins/hyprbars.so
bind = $mainMod, Y, exec, hyprctl plugin load $hyprbars 
bind = $mainMod Shift, Y, exec, hyprctl plugin unload $hyprbars
# Media keys
bind = , F10, exec, playerctl play-pause
bind = , F11, exec, playerctl next
bind = , F9, exec, playerctl previous
#bind = $mainMod, G, exec, dms ipc call dankdash wallpaper
bind = $mainMod SHIFT, V, exec, dms ipc call clipboard toggle
bind = SUPER ALT, L, exec, dms ipc call lock lock
bind = $mod SHIFT, N, exec, dms ipc call notifications toggle
#bind = SUPER SHIFT, ESC, exec, dms ipc call powermenu toggle
#bind = SUPER SHIFT, M, exec, dms ipc call processlist focusOrToggle
bind = SUPER SHIFT, N, exec, dms ipc call notepad toggle
bind = SUPER SHIFT, Slash, exec, dms ipc call keybinds toggle hyprland
bind = $mod, comma, exec, dms ipc call settings focusOrToggle
bind = SUPER, space, exec, dms ipc call spotlight toggle
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, I, movetoworkspace, e-1
bind = $mainMod, 0, workspace, 10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, S, togglespecialworkspace

bind = $mainMod SHIFT, S, movetoworkspace, special
bind = SUPER SHIFT, mouse_up, movetoworkspace, e+1
bind = SUPER SHIFT, mouse_down, movetoworkspace, e-1
bind = SUPER, mouse_down, workspace, e-1
bind = SUPER, mouse_up, workspace, e+1
#bind = SUPER SHIFT, U, movetoworkspace, e+1
#bind = SUPER, U, workspace, e+1

binddm = $mainMod, X, $d hold to resize window, resizewindow
binddm = $mainMod, Z, $d hold to move window, movewindow
binddm = $mainMod, mouse:272, $d hold to move window, movewindow
binddm = $mainMod, mouse:273, $d hold to resize window, resizewindow

$d=[$wm|Change focus]

bindd = $mainMod, Left, $d focus left, movefocus, l
bindd = $mainMod, Right, $d focus right , movefocus, r
bindd = $mainMod, Up, $d focus up , movefocus, u
bindd = $mainMod, Down , $d focus down, movefocus, d
bindd = ALT, Tab,$d Cycle focus, cyclenext
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
binde = SUPER SHIFT, equal, resizeactive, 0 10%
binde = SUPER SHIFT, minus, resizeactive, 0 -10%
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0
binde = SUPER, equal, resizeactive, 10% 0
binde = SUPER, minus, resizeactive, -10% 0
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow
# Master layout
bind = SUPER, M, layoutmsg, addmaster
bind = SUPER Shift, M, layoutmsg, removemaster
bind = SUPER, H, layoutmsg, mfact -0.05
bind = SUPER, L, layoutmsg, mfact +0.05
# Scrolling layout
# move the view by columns
bind = SUPER, period, layoutmsg, move +col
bind = SUPER, comma,  layoutmsg, move -col
# move windows between columns / directions (promotes to new column at right edge)
bind = SUPER SHIFT, period, layoutmsg, movewindowto r
bind = SUPER SHIFT, comma,  layoutmsg, movewindowto l
bind = SUPER SHIFT, up,     layoutmsg, movewindowto u
bind = SUPER SHIFT, down,   layoutmsg, movewindowto d
# resize current column
bind = SUPER, equal, layoutmsg, colresize +0.1
bind = SUPER, minus, layoutmsg, colresize -0.1
bind = SUPER, c,     layoutmsg, colresize +conf     # cycle to next preset width
bind = SUPER, x,     layoutmsg, colresize -conf     # cycle backward

# column management
bind = SUPER, p, layoutmsg, promote                  # put focused window in a new column
bind = SUPER, f, layoutmsg, togglefit                # toggle center vs fit
bind = SUPER SHIFT, a, layoutmsg, swapcol r                # swap this column to the right
bind = SUPER, a, layoutmsg, swapcol l                # swap to the left

# move whole column to another workspace
bind = SUPER, 1, layoutmsg, movecoltoworkspace 1
bind = SUPER, 2, layoutmsg, movecoltoworkspace 2
bind = SUPER, 3, layoutmsg, movecoltoworkspace 3
