# =====================================================================
#  #Nicks Keybinds for Hyprland (DMS-friendly)
# =====================================================================

# ---------------------------------------------------------------------
#  Vars
# ---------------------------------------------------------------------
$mainMod = SUPER
$mod     = ALT

$terminal0 = kitty
$terminal1 = konsole
$pypr     = /usr/bin/pypr-client

$menu  = /home/nick/.config/rofi/scripts/launcher_t1
$menu1 = /home/nick/.config/rofi/launchers/type-3/launcher.sh
$menu2 = /home/nick/.config/rofi/unicode-launcher.sh

$hyprbars = /var/cache/hyprpm/nick/hyprland-plugins/hyprbars.so

# DMS grouping labels (you can change wording)
$wm = Window Management
$ws = Workspaces
$sys = System
$apps = Apps
$media = Media
$misc = Misc
# =====================================================================
#  DMS CORE (pulled from your 1st list, adapted to your 2nd)
#  - 2nd config takes precedence: conflicts were skipped/remapped
# =====================================================================

$d = [$sys|DMS]
bind  = $mod,           TAB,   exec, dms ipc call hypr toggleOverview
bind  = $mod,           V,     exec, dms ipc call clipboard toggle
bind  = $mod,           X,     exec, dms ipc call powermenu toggle
bind  = $mod,           Y,     exec, dms ipc call dankdash wallpaper
bind  = $mod,           comma, exec, dms ipc call settings focusOrToggle
bind  = $mod,           space, exec, dms ipc call spotlight toggle
bind = $mod, U, exec, /home/nick/.local/bin/web 
bind  = $mod SHIFT,     N,     exec, dms ipc call notifications toggle
bind  = $mod SHIFT,     Slash, exec, dms ipc call keybinds toggle hyprland
bind  = $mod SHIFT,     W,     exec, dms ipc call window-rules toggle
bind  = $mod ALT,       L,     exec, dms ipc call lock lock

# Notepad toggle (you said “add it in once done too”)
bind  = $mod,           N,     exec, dms ipc call notepad toggle
bind = $mod, E, exec, wayb

# =====================================================================
#  SCREENSHOTS (DMS PrintScreen set, non-conflicting with your F12 grim)
# =====================================================================
$d = [$misc|Screenshots (DMS)]
bind  = ,         Print, exec, dms screenshot
bind  = CTRL,     Print, exec, dms screenshot full
bind  = ALT,      Print, exec, dms screenshot window
bind  = ,         Print, exec, dms screenshot         # keep (matches your first list behavior)


# =====================================================================
#  MEDIA KEYS (keep your existing volume binds; add CTRL+media for MPRIS seek)
# =====================================================================
$d = [$media|MPRIS Seek]
bindel = CTRL, XF86AudioLowerVolume, exec, dms ipc call mpris decrement 3
bindel = CTRL, XF86AudioRaiseVolume, exec, dms ipc call mpris increment 3

bind  = $mod CTRL, left,  focusmonitor, l
bind  = $mod CTRL, right, focusmonitor, r

# =====================================================================
#  APPS / LAUNCHERS
# =====================================================================
$d = [$apps|Rofi]
bindd = $mainMod SHIFT, D, $d Launcher (t1),           exec, pkill rofi || $menu
bindd = $mod,           D, $d Apps,                    exec, pkill rofi || $menu1
bindd = $mainMod,       SPACE, $d Unicode launcher,        exec, pkill rofi || $menu2
bind  = $mod SHIFT,     Y, exec, ~/.local/bin/yt-rofi-dl

$d = [$apps|Common]
bindd = $mainMod, T, $d Terminal,                      exec, $terminal0
bindd = $mod, T, $d Terminal  (alt),                   exec, $terminal1
bindd = $mod SHIFT,           T, $d Waypaper,                exec, waypaper
bindd = $mod SHIFT,     B,   $d Chromium,                 exec, chromium  
bindd = $mod,           B,   $d Zen browser,                  exec, zen-browser
bindd = $mainMod,       E,   $d Dolphin,                  exec, dolphin
bindd = $mainMod SHIFT, E, $d Nautilus,                exec, nautilus

# quick image open (your screenshot ref)
bind  = $mainMod, G, exec, ristretto -f /home/nick/Pictures/screenshot_1769202072.png


# =====================================================================
#  WAYBAR / THEMING / WALLS
# =====================================================================
$d = [$sys|Bar & Theme]
bindd = $mainMod,        R, $d Restart Waybar,          exec, ~/.config/waybar/scripts/launch.sh
bindd = $mainMod SHIFT,  R, $d Waybar layout switcher,  exec, /home/nick/.local/bin/waybar-layout-switcher

#bindd = $mainMod,       T, $d Theme switcher,          exec, pkill rofi || ~/.config/colorschemes/rofi-launcher.sh
#bindd = $mainMod SHIFT, T, $d Wallpaper selector,      exec, pkill rofi || ~/.config/colorschemes/wallpaper-selector.sh
bindd = $mod     SHIFT,  T, $d Waypaper,                exec, waypaper

# =====================================================================
#  WINDOW MANAGEMENT
# =====================================================================
$d = [$wm|Basics]
bindd = $mainMod,       W, [$wm|Steam] dontkillsteam,     exec, ~/.local/bin/dontkillsteam.sh
bindd = $mainMod SHIFT, K,   $d Kill active,              exec, hyprctl kill
bindd = $mainMod,       M,   $d Toggle floating,          togglefloating 
bind =  $mainMod,       F,                                fullscreen, 1
bind =  $mainMod SHIFT, F,                                fullscreen, 0

# pin (keep ONE definition)
bindd = $mod,           Q, Toggle pin, pin,

# Hyprexpo / Exposed workspace
$d = [$wm|Expose]
bindd = $mainMod, Q, $d Hyprexpo toggle,               hyprexpo:expo, toggle
#bindd = $mod,     , $d Pypr expose,                   exec, pypr expose
#workspace = special:exposed,gapsout:60,gapsin:30,bordersize:5,border:true,shadow:false

# Color picker / Lock / Notification center
$d = [$wm|Tools]
bindd = $mainMod SHIFT,       H, $d Hyprpicker (copy),    exec, hyprpicker -a
bindd = $mainMod SHIFT, L, $d Lock (hyprlock),            exec, hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf

# Overwatch (control center)
bind = $mod, A, exec, swaync-client -t -sw
#bind = $mainMod Control Shift, A, exec, swaync-client -R && swaync-client -rs

# =====================================================================
#  SCRATCHPADS (pyprland)
# =====================================================================
$d = [$wm|Scratchpads]
bindd = $mod, 1, $d Dropdown terminal,                 exec, $pypr toggle console
bindd = $mod, 2, $d Music,                             exec, $pypr toggle music
bindd = $mod, 3, $d Files,                             exec, $pypr toggle files
bindd = $mod, 4, $d Neovim,                            exec, $pypr toggle neovim


# =====================================================================
#  HYPRBARS PLUGIN (load/unload)
# =====================================================================
$d = [$wm|Titlebars]
bindd = $mainMod,       Y, $d Load hyprbars,           exec, hyprctl plugin load $hyprbars
bindd = $mainMod SHIFT, Y, $d Unload hyprbars,         exec, hyprctl plugin unload $hyprbars


# =====================================================================
#  SCRIPTS / MODES
# =====================================================================
$d = [$sys|Scripts]
bindd = $mod,     F1,  $d Blitz mode,                  exec, ~/.config/hypr/scripts/blitz-mode.sh
bindd = $mod,     F12, $d Rotate DP-2,                 exec, /home/nick/.local/bin/rotate-dp-2.sh
bindd = $mainMod, N,   $d Night mode,                  exec, ~/.local/bin/night-mode.sh
#bindd = $mod,     C,   $d Focus clock,                exec, ~/.local/bin/focus-clock

# =====================================================================
#  SCREENSHOTS
# =====================================================================
$d = [$misc|Screenshots]
bindd = $mainMod,       F12, $d Screenshot (5s),       exec, grim -t png -l 5 "$HOME/Pictures/Screenshots/screenshot_$(date +%F_%H-%M-%S).png"
bindd = $mainMod SHIFT, F12, $d Screenshot (area),     exec, grim -t png -l 0 -g "$(slurp)" "$HOME/Pictures/Screenshots/screenshot_$(date +%F_%H-%M-%S).png"


# =====================================================================
#  AUDIO / MEDIA KEYS
# =====================================================================
$d = [$media|Playback]
bindd = , F10, $d Play/Pause,                          exec, playerctl play-pause
bindd = , F11, $d Next,                                exec, playerctl next
bindd = , F9,  $d Previous,                            exec, playerctl previous 

$d = [$media|Volume (DMS)]
bindd = , XF86AudioRaiseVolume, $d Volume +2%,         exec, dms ipc call audio increment 2
bindd = , XF86AudioLowerVolume, $d Volume -2%,         exec, dms ipc call audio decrement 2

$d = [$ws|Special workspace]
bindd = $mainMod SHIFT, S, $d Toggle stash,                togglespecialworkspace, stash
bindd = $mod SHIFT, S, $d Move to scratchpad,          movetoworkspace, special
bindd = $mod CTRL,   S, $d Move scratchpad silent,     movetoworkspacesilent, special
bindd = $mod,       S, $d Toggle scratchpad,           togglespecialworkspace

# =====================================================================
#  WORKSPACES
# =====================================================================
$d = [$ws|Navigate]
bindd = $mainMod, 1, $d Workspace 1,                   workspace, 1
bindd = $mainMod, 2, $d Workspace 2,                   workspace, 2
bindd = $mainMod, 3, $d Workspace 3,                   workspace, 3
bindd = $mainMod, 4, $d Workspace 4,                   workspace, 4
bindd = $mainMod, 5, $d Workspace 5,                   workspace, 5
bindd = $mainMod, 6, $d Workspace 6,                   workspace, 6
bindd = $mainMod, 7, $d Workspace 7,                   workspace, 7
bindd = $mainMod, 8, $d Workspace 8,                   workspace, 8
bindd = $mainMod, 9, $d Workspace 9,                   workspace, 9
bindd = $mainMod, 0, $d Workspace 10,                  workspace, 10

$d = [$ws|Relative]
bindd = $mainMod CTRL, Right, $d Next workspace,       workspace, r+1
bindd = $mainMod CTRL, Left,  $d Prev workspace,       workspace, r-1
bindd = $mainMod CTRL, Down,  $d Nearest empty,        workspace, empty

$d = [$ws|Move window]
bindd = $mainMod SHIFT, 1, $d To ws 1,                 movetoworkspace, 1
bindd = $mainMod SHIFT, 2, $d To ws 2,                 movetoworkspace, 2
bindd = $mainMod SHIFT, 3, $d To ws 3,                 movetoworkspace, 3
bindd = $mainMod SHIFT, 4, $d To ws 4,                 movetoworkspace, 4
bindd = $mainMod SHIFT, 5, $d To ws 5,                 movetoworkspace, 5
bindd = $mainMod SHIFT, 6, $d To ws 6,                 movetoworkspace, 6
bindd = $mainMod SHIFT, 7, $d To ws 7,                 movetoworkspace, 7
bindd = $mainMod SHIFT, 8, $d To ws 8,                 movetoworkspace, 8
bindd = $mainMod SHIFT, 9, $d To ws 9,                 movetoworkspace, 9
bindd = $mainMod SHIFT, 0, $d To ws 10,                movetoworkspace, 10

$d = [$ws|Move window silently]
bindd = $mainMod CTRL, 1, $d To ws 1 (silent),          movetoworkspacesilent, 1
bindd = $mainMod CTRL, 2, $d To ws 2 (silent),          movetoworkspacesilent, 2
bindd = $mainMod CTRL, 3, $d To ws 3 (silent),          movetoworkspacesilent, 3
bindd = $mainMod CTRL, 4, $d To ws 4 (silent),          movetoworkspacesilent, 4
bindd = $mainMod CTRL, 5, $d To ws 5 (silent),          movetoworkspacesilent, 5
bindd = $mainMod CTRL, 6, $d To ws 6 (silent),          movetoworkspacesilent, 6
bindd = $mainMod CTRL, 7, $d To ws 7 (silent),          movetoworkspacesilent, 7
bindd = $mainMod CTRL, 8, $d To ws 8 (silent),          movetoworkspacesilent, 8
bindd = $mainMod CTRL, 9, $d To ws 9 (silent),          movetoworkspacesilent, 9
bindd = $mainMod CTRL, 0, $d To ws 10 (silent),         movetoworkspacesilent, 10


# =====================================================================
#  FOCUS / MONITORS
# =====================================================================##########################################################
$d = [$wm|Focus]
bindd = $mainMod, Tab, $d Cycle focus,                      cyclenext
bindd = $mainMod, H,    $d Focus up,                        movefocus, u
bindd = $mainMod, J,  $d Focus down,                        movefocus, d
bindd = $mainMod, K,  $d Focus left,                        movefocus, l
bindd = $mainMod, L, $d Focus right,                        movefocus, r

$d = [$wm|Monitors]
bindd = $mainMod SHIFT, mouse_up,   $d Focus next monitor,      focusmonitor, +1
bindd = $mainMod SHIFT, mouse_down, $d Focus prev monitor,      focusmonitor, -1
bindd = $mainMod SHIFT, Right,      $d Move window -> next mon, movewindow, mon:+1
bindd = $mainMod SHIFT, Left,       $d Move window -> prev mon, movewindow, mon:-1


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# =====================================================================#################################################################### 
#  RESIZE / MOVE (keyboard + mouse)
# =====================================================================
# Resize and move windows using keyboard
bind = CTRL ALT, LEFT, resizeactive, -50 0
bind = CTRL ALT, RIGHT, resizeactive, 50 0
bind = CTRL ALT, UP, resizeactive, 0 -50
bind = CTRL ALT, DOWN, resizeactive, 0 50

#bind = SUPER_SHIFT, left, movewindow, l
#bind = SUPER_SHIFT, right, movewindow, r
#bind = SUPER_SHIFT, up, movewindow, u
#bind = SUPER_SHIFT, down, movewindow, d

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
$d = #! unset the group name
binddm = $mainMod, mouse:272, $d Hold to move window,  movewindow
binddm = $mainMod, mouse:273, $d Hold to resize,       resizewindow


# =====================================================================
#  LAYOUTS (master + scrolling)
# =====================================================================
$d = [$wm|Dwindle]
bindd = $mod SHIFT, P, $d Pseudotile (dwindle),        pseudo
bindd = $mod,       J, $d Toggle split direction,      togglesplit

$d = [$wm|Layouts]
bindd = $mainMod,       J, $d Switch to scrolling,     exec, hyprctl keyword general:layout master
bindd = $mainMod SHIFT, J, $d Switch to master,        exec, hyprctl keyword general:layout dwindle

bindd = $mainMod SHIFT, up,      $d Move window up,    layoutmsg, movewindowto u
bindd = $mainMod SHIFT, down,    $d Move window down,  layoutmsg, movewindowto d
# Master layout controls
$d = [$wm|Master]
#bindd = $mainMod SHIFT, M,        $d Add master,             layoutmsg, addmaster
#bindd = $mod SHIFT, M,  $d Remove master,          layoutmsg, removemaster
bindd = $mainMod, X,        $d mfact -0.05,            layoutmsg, mfact -0.05
bindd = $mainMod, C,        $d mfact +0.05,            layoutmsg, mfact +0.05

# Scrolling layout controls
#$d = [$wm|Scrolling]
#bindd = $mainMod, period,        $d Move view +col,    layoutmsg, move +col
#bindd = $mainMod, comma,         $d Move view -col,    layoutmsg, move -col
#bindd = $mainMod SHIFT, period,  $d Move window right, layoutmsg, movewindowto r
#bindd = $mainMod SHIFT, comma,   $d Move window left,  layoutmsg, movewindowto l
#bindd = $mainMod SHIFT, up,      $d Move window up,    layoutmsg, movewindowto u
#bindd = $mainMod SHIFT, down,    $d Move window down,  layoutmsg, movewindowto d
#
#bindd = $mainMod, equal,         $d Col resize +0.1,   layoutmsg, colresize +0.1
#bindd = $mainMod, minus,         $d Col resize -0.1,   layoutmsg, colresize -0.1
#bindd = $mainMod, c,             $d Col resize +conf,  layoutmsg, colresize +conf
#bindd = $mainMod, x,             $d Col resize -conf,  layoutmsg, colresize -conf
## If scrollleft/scrollright work, use them for mouse too:
#
#bind = $mainMod, left, focusmonitor, l
#bind = $mainMod, right, focusmonitor, r
#
#bindd = $mainMod, p,             $d Promote,           layoutmsg, promote
#bindd = $mainMod, f,             $d Toggle fit,        layoutmsg, togglefit
#bindd = $mainMod, d,             $d Swap col right,    layoutmsg, swapcol r
#bindd = $mainMod, a,             $d Swap col left,     layoutmsg, swapcol l

#bind = $mainMod, C, layoutmsg, centeractive
#bind = $mainMod, H, layoutmsg, scrollleft
#bind = $mainMod, L, layoutmsg, scrollright
# Move whole column to another workspace (kept from you)
#bindd = $mainMod, 1, layoutmsg, movecolworkspace 1
#bindd = $mainMod, 2, layoutmsg, movecolworkspace 2
#bindd = $mainMod, 3, layoutmsg, movecolworkspace 3


# =====================================================================
#  CURSOR ZOOM (accessibility)
# =====================================================================
$d = [$misc|Cursor]
bindd = $mod SHIFT, mouse_down, $d Zoom in,  exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
bindd = $mod SHIFT, mouse_up,   $d Zoom out, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
bindd = $mod SHIFT, 0,    $d Reset zoom, exec, hyprctl -q keyword cursor:zoom_factor 1


# =====================================================================
#  LOGOUT
# =====================================================================
$d = [$sys|Logout]
bindd = CTRL ALT, DELETE, $d Wlogout, exec, wlogout -C "$HOME/.config/wlogout/style.css" \
  -l "$HOME/.config/wlogout/layout" \
  --protocol layer-shell \
  -b 5 \
  -T 400 \
  -B 400
