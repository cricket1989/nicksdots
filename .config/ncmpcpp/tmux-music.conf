kill-pane -a

# left/right split (right side 60% width)
split-window -h -p 60

# right side half/half
split-window -v -p 50

select-pane -t 0
send-keys "ncmpcpp" C-m

select-pane -t 1
send-keys "ncmpcpp -s visualizer" C-m

select-pane -t 2
send-keys "~/.config/ncmpcpp/show-art.sh" C-m

select-pane -t 0
