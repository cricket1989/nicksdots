## WirePlumber device priority rules
## G430 USB headset always wins over HDMI/DP outputs
## nick@cachyos

monitor.alsa.rules = [
  ## Logitech G430 — highest priority (USB headset, DP-2)
  {
    matches = [
      { node.name = "~alsa_output.usb-Logitech.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        node.nick        = "G430 Headset"
      }
    }
  }

  ## HDMI/DP outputs (speakers on DP-3) — low priority, never steal default
  {
    matches = [
      { node.name = "~alsa_output.pci-.*\\.hdmi-.*" }
    ]
    actions = {
      update-props = {
        priority.session = 500
        node.nick        = "DP Speakers"
      }
    }
  }
]
