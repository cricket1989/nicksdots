# Matugen — WezTerm color scheme template
# Output: ~/.config/wezterm/colors/matugen.toml
# Activated in wezterm.lua by setting USE_MATUGEN = true

[metadata]
name        = "matugen"
author      = "matugen"

[colors]
foreground  = "{{colors.on_surface.default.hex}}"
background  = "{{colors.surface.default.hex}}"

cursor_bg     = "{{colors.primary.default.hex}}"
cursor_fg     = "{{colors.on_primary.default.hex}}"
cursor_border = "{{colors.primary.default.hex}}"

selection_bg  = "{{colors.secondary_fixed_dim.default.hex}}"
selection_fg  = "{{colors.on_secondary.default.hex}}"

# ANSI 0-7
ansi = [
  "#262626",
  "{{colors.error.default.hex}}",
  "{{colors.tertiary.default.hex}}",
  "{{colors.secondary.default.hex}}",
  "{{colors.primary.default.hex}}",
  "{{colors.tertiary_container.default.hex}}",
  "{{colors.primary_container.default.hex}}",
  "{{colors.on_surface.default.hex}}"
]

# Bright 8-15
brights = [
  "#4c4c4c",
  "{{colors.on_error_container.default.hex}}",
  "{{colors.on_tertiary_container.default.hex}}",
  "{{colors.on_secondary_container.default.hex}}",
  "{{colors.primary_fixed_dim.default.hex}}",
  "{{colors.tertiary_fixed_dim.default.hex}}",
  "{{colors.primary_fixed.default.hex}}",
  "#f0f0f0"
]

[colors.tab_bar]
background = "{{colors.surface.default.hex}}"

[colors.tab_bar.active_tab]
bg_color = "{{colors.primary.default.hex}}"
fg_color = "{{colors.on_primary.default.hex}}"

[colors.tab_bar.inactive_tab]
bg_color = "{{colors.surface.default.hex}}"
fg_color = "{{colors.on_surface_variant.default.hex}}"

[colors.tab_bar.inactive_tab_hover]
bg_color = "{{colors.surface_variant.default.hex}}"
fg_color = "{{colors.on_surface.default.hex}}"

[colors.tab_bar.new_tab]
bg_color = "{{colors.surface.default.hex}}"
fg_color = "{{colors.on_surface_variant.default.hex}}"
